<meta charset="utf-8">

<link rel="icon" href="test-icon-192.png">

<style>
/* VOICE: a quiz-show scoreboard — energetic but legible, rules first.
   IDEA: the stadium tablo: one live ranked board that reshuffles after every question.
   PICTURE: the leaderboard itself, rows sliding to new places; big countdown bar.
   COLOUR and TYPE: aluminium + ink, orange #ff4f00 pointer, medal gold/silver/bronze; Unbounded numerals, Golos Text body (Cyrillic).
   LAYOUT: host = question left, tablo right; phone = one column, four big answer buttons. */
:root{color-scheme:light dark;--bg:light-dark(#e9eaec,#141517);--card:light-dark(#fff,#1e2022);--ink:light-dark(#0b0b0d,#f1f2f3);--mute:light-dark(#5d6168,#9aa0a8);--line:light-dark(#d3d5d9,#2d3034);--acc:#ff4f00;--gold:#e0a400;--silver:#9aa3ad;--bronze:#b8693a;--ok:#1f9d55;--bad:#d93a3a;--c0:#e5484d;--c1:#3e63dd;--c2:#d98a00;--c3:#1f9d55}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Golos Text",system-ui,sans-serif;overflow-x:clip}
h1,h2,.num{font-family:Unbounded,"Golos Text",sans-serif;font-weight:700;line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,44px)}h2{font-size:clamp(20px,2.6vw,28px)}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,40px) max(4vw,14px)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:20px}
.tag{font-size:14px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,2.4vw,28px)}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
button,input,select{font:inherit;font-size:16px}
.btn{min-height:48px;padding:10px 22px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=text],input[type=number]{min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
input[type=number]{width:96px}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:7px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:15px;cursor:pointer;color:var(--ink)}
.chip.off{opacity:.45}
.big{font-size:clamp(40px,7vw,84px)}
/* countdown */
.bar{height:14px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc);width:100%;transition:width .2s linear}
.timer{display:flex;align-items:center;gap:14px;margin:14px 0 18px}
.timer .bar{flex:1}.timer .num{font-size:28px;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.qmeta{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:14px;margin-bottom:8px}
.qtext{font-size:clamp(19px,2.3vw,27px);font-weight:600;line-height:1.35;margin:0 0 6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(max-width:700px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;min-height:64px;padding:14px 16px;border-radius:14px;border:2px solid transparent;color:#fff;font-weight:500;font-size:16px;line-height:1.35;cursor:pointer;position:relative}
.opt b{font-family:Unbounded,sans-serif;flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:15px}
.opt[data-i="0"]{background:var(--c0)}.opt[data-i="1"]{background:var(--c1)}.opt[data-i="2"]{background:var(--c2)}.opt[data-i="3"]{background:var(--c3)}
.opt.dim{opacity:.28}.opt.pick{border-color:var(--ink);box-shadow:0 0 0 3px var(--card) inset}
.opt.right{opacity:1;outline:4px solid var(--ok);outline-offset:2px}
.opt .cnt{margin-inline-start:auto;font-family:Unbounded,sans-serif;font-size:15px;flex:none;padding-inline-start:8px}
.basis{margin-top:14px;font-size:14px;color:var(--mute)}
/* tablo */
.board{display:grid;gap:6px;position:relative}
.br{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:var(--bg);will-change:transform}
.br .pl{font-family:Unbounded,sans-serif;font-size:15px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.br:nth-child(1) .pl{background:var(--gold);color:#1b1300;border:0}.br:nth-child(2) .pl{background:var(--silver);color:#111;border:0}.br:nth-child(3) .pl{background:var(--bronze);color:#fff;border:0}
.br .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br .sc{font-family:Unbounded,sans-serif;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
.br .sc small{font-family:"Golos Text",sans-serif;font-size:13px;color:var(--mute);margin-inline-start:6px}
.br.me{outline:2px solid var(--acc)}
.br .up{color:var(--ok);font-size:13px;margin-inline-start:6px}.br .dn{color:var(--bad);font-size:13px;margin-inline-start:6px}
.empty{color:var(--mute);padding:14px 0}
/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin:18px 0 26px}
.pod{text-align:center}.pod .nm{font-weight:700;margin-bottom:8px;overflow-wrap:anywhere}
.pod .blk{border-radius:14px 14px 4px 4px;display:grid;place-items:center;color:#fff;font-family:Unbounded,sans-serif;font-size:clamp(28px,5vw,48px)}
.pod .s{font-size:14px;color:var(--mute);margin-top:6px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start}th{font-size:13px;color:var(--mute);font-weight:500}td.r,th.r{text-align:right;white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mute)}.dot.on{background:var(--ok)}
.note{font-size:14px;color:var(--mute);margin-top:10px}
.msg{font-size:clamp(20px,3vw,28px);font-weight:600;text-align:center;padding:24px 0}
.res{text-align:center;padding:10px 0 4px}.res .num{font-size:clamp(34px,8vw,60px)}
.good{color:var(--ok)}.badc{color:var(--bad)}
.pulse{animation:p 1.4s ease-in-out infinite}@keyframes p{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.bar i{transition:none}}
.stack thead{}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute)}}
</style>
<style>
.brand a{display:block;flex:none}
.code{font-family:Unbounded,sans-serif;font-size:clamp(48px,9vw,96px);letter-spacing:.08em;line-height:1}
.join{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media(max-width:600px){.join{grid-template-columns:minmax(0,1fr)}}
#qr{background:#fff;padding:10px;border-radius:12px;width:max-content}#qr img,#qr canvas{display:block}
.link{font-size:14px;overflow-wrap:anywhere;color:var(--mute)}
textarea{font:14px/1.4 ui-monospace,monospace;width:100%;min-height:160px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.err{color:var(--bad);font-size:14px;margin-top:8px;min-height:1em}
.brand{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}.brand img{border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--card)}.brand b{display:block;font-family:Unbounded,sans-serif;font-size:clamp(15px,2vw,19px);color:var(--brand);letter-spacing:.01em}.brand span{font-size:13px;color:var(--mute)}
:root{--brand:light-dark(#193f94,#9db4f5);--acc:light-dark(#193f94,#7d9cf0)}.btn.pri{color:light-dark(#fff,#0b1430)}
.inst{margin-inline-start:auto;min-height:44px;padding:8px 16px;font-size:15px}.insthint{margin-inline-start:auto;font-size:13px;color:var(--mute);max-width:220px;text-align:end}@media(max-width:520px){.brand{flex-wrap:wrap}.inst,.insthint{margin-inline-start:0;width:100%;text-align:start;max-width:none}}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:420px){.brand{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}.brand img{border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--card)}.brand b{display:block;font-family:Unbounded,sans-serif;font-size:clamp(15px,2vw,19px);color:var(--brand);letter-spacing:.01em}.brand span{font-size:13px;color:var(--mute)}
:root{--brand:light-dark(#193f94,#9db4f5);--acc:light-dark(#193f94,#7d9cf0)}.btn.pri{color:light-dark(#fff,#0b1430)}
.two{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

const QS = JSON.parse(document.getElementById('qs').textContent);
const N = QS.length, DUR = 20000, TOTAL = N * DUR;
const L = ['A','B','C','D'];
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const rid = () => Math.random().toString(36).slice(2,12).replace(/[^a-z0-9]/g,'') + 'x0';
const sec = ms => (ms/1000).toFixed(1).replace('.',',');
const params = new URLSearchParams(location.search);
const API = '/api/test';

/* ---------- server bilan aloqa ---------- */
let off = 0, bestRtt = 1e9, conn = true;
const now = () => Date.now() + off;
async function api(op, body, query){
  const qs = new URLSearchParams({op, ...(query||{})}).toString();
  const t0 = Date.now();
  let r, j;
  try{
    r = await fetch(API + '?' + qs, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {cache:'no-store'});
    j = await r.json();
  }catch(e){ setConn(false); throw new Error('Интернетга уланиб бўлмади'); }
  setConn(true);
  const rtt = Date.now() - t0;
  if(j && j.now && rtt <= bestRtt + 150){ bestRtt = Math.min(bestRtt, rtt); off = j.now + rtt/2 - Date.now(); }
  if(!r.ok || !j.ok){ const e = new Error(j && j.message || 'Хато'); e.status = r.status; throw e; }
  return j;
}
function setConn(v){ if(v === conn) return; conn = v; document.querySelectorAll('.status').forEach(x => x.outerHTML = statusHTML()); }
const statusHTML = () => `<span class="status"><span class="dot${conn?' on':''}"></span>${conn?'Уланиш бор':'Интернет узилди…'}</span>`;

/* ---------- ilova o'rnatish ---------- */
let deferredPrompt = null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
function installHTML(){
  if(standalone()) return '';
  if(deferredPrompt) return '<button class="btn inst" data-install>📲 Иловани ўрнатиш</button>';
  if(isIOS) return '<span class="insthint">Илова қилиш: Safari’да «Улашиш» ⬆︎ → «Бош экранга қўшиш»</span>';
  return '';
}
function refreshInstall(){ document.querySelectorAll('.brand').forEach(b=>{ const o=b.querySelector('.inst,.insthint'); if(o) o.remove(); b.insertAdjacentHTML('beforeend', installHTML()); }); }
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; refreshInstall(); });
addEventListener('appinstalled', () => { deferredPrompt = null; refreshInstall(); });
document.addEventListener('click', async e => { if(!e.target.closest('[data-install]') || !deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(_){} deferredPrompt = null; refreshInstall(); });
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/test-sw.js', {scope:'/test'}).catch(()=>{});

const brand = () => `<header class="brand"><a href="/" aria-label="Бош саҳифа"><img src="data:image/jpeg;base64,${LOGO}" alt="YURISTKADR логотипи" width="56" height="56"></a><div><b>«YURIST VA KADR» NTM</b><span>Нодавлат таълим муассасаси</span></div>${installHTML()}</header>`;

/* ---------- umumiy ko'rinishlar ---------- */
function board(el, rows, prog){
  const before = {};
  el.querySelectorAll('.br').forEach(r => before[r.dataset.k] = r.getBoundingClientRect().top);
  if(!rows.length){ el.innerHTML = '<div class="empty">Ҳали иштирокчи йўқ</div>'; return; }
  el.innerHTML = rows.map((r,i) => `<div class="br${r.me?' me':''}" data-k="${esc(r.k || r.n)}"><span class="pl">${i+1}</span><span class="nm">${esc(r.n)}</span><span class="sc">${r.s}<small>${prog ? (r.d||0)+'/'+N+' · ' : ''}${sec(r.t)} с</small></span></div>`).join('');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  el.querySelectorAll('.br').forEach(r => {
    const b = before[r.dataset.k]; if(b === undefined) return;
    const d = b - r.getBoundingClientRect().top;
    if(d) r.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:800,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
}
function podium(rs){
  return `<div class="podium">${[1,0,2].map(i=>rs[i] ? `<div class="pod"><div class="nm">${esc(rs[i].n)}</div><div class="blk" style="height:${[150,110,80][i]}px;background:${['var(--gold)','var(--silver)','var(--bronze)'][i]}">${i+1}</div><div class="s">${rs[i].s} та тўғри · ${sec(rs[i].t)} с</div></div>` : '<div></div>').join('')}</div>`;
}
const clock = ms => `${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}`;

/* =================== O'QITUVCHI =================== */
const H = {code:null, token:null, st:null, board:[], players:[], timer:null, busy:false, ending:false};
function hHome(){
  clearInterval(H.timer); H.code = null; H.st = null;
  const last = store.get('test-host');
  app.innerHTML = brand() + `<div class="top"><div><h1>Харид тести: жонли ўйин</h1><div class="tag">${N} та савол · ҳар бирига 20 сония · ўқитувчи саҳифаси</div></div>${statusHTML()}</div>
  <div class="card" style="max-width:760px"><h2>Янги ўйин</h2>
  <p>Ўйин яратилгач, ўқувчилар учун код, ҳавола ва QR-код чиқади. Улар телефонда очиб, исм ва фамилиясини ёзиб қўшилади.</p>
  <p>Бошлангандан кейин ҳар ким ўз телефонида ишлайди: жавоб берса кейинги саволга дарров ўтади, 20 сония ичида жавоб бермаса ҳам ўзи ўтади. Табло шу экранда жонли янгиланади.</p>
  <div class="row"><button class="btn pri" id="new">Ўйин яратиш</button>${last && last.code ? `<button class="btn" id="res">${esc(last.code)} ўйинига қайтиш</button>` : ''}</div>
  <div class="err" id="err"></div></div>`;
  document.getElementById('new').onclick = async e => {
    e.target.disabled = true;
    try{ const j = await api('create', {}); store.set('test-host', {code:j.code, token:j.token}); hOpen(j.code, j.token); }
    catch(err){ document.getElementById('err').textContent = err.message; e.target.disabled = false; }
  };
  const r = document.getElementById('res'); if(r) r.onclick = () => hOpen(last.code, last.token);
}
function hOpen(code, token){
  H.code = code; H.token = token; H.st = null; H.ending = false;
  clearInterval(H.timer); hPoll(); H.timer = setInterval(hPoll, 1500);
}
async function hPoll(){
  if(H.busy || !H.code) return; H.busy = true;
  try{
    const j = await api('live', {code:H.code, token:H.token});
    const ch = !H.st || H.st.ph !== j.state.ph;
    H.st = j.state; H.board = j.board || []; H.players = j.players || [];
    if(ch) hRender(); else hLive();
    if(H.st.ph === 'final') clearInterval(H.timer);
  }catch(e){
    if(e.status === 404 || e.status === 403){ clearInterval(H.timer); store.set('test-host', null); hHome(); document.getElementById('err').textContent = 'Ўйин топилмади ёки муддати ўтган.'; }
  }finally{ H.busy = false; }
}
async function hEnd(){ if(H.ending) return; H.ending = true; try{ await api('end', {code:H.code, token:H.token}); }catch(e){ H.ending = false; } hPoll(); }
setInterval(() => {
  const st = H.st; if(!H.code || !st || st.ph !== 'run') return;
  const t = now(), left = Math.max(0, st.s + TOTAL - t);
  const tn = document.getElementById('tnum'), tb = document.getElementById('tbar');
  if(tn) tn.textContent = t < st.s ? 'Тайёр' : clock(left);
  if(tb) tb.style.width = (Math.min(TOTAL,left)/TOTAL*100) + '%';
  if(t > st.s + TOTAL + 5000 || (H.board.length && H.board.every(r => r.d >= N))) hEnd();
}, 500);
function hLive(){
  const st = H.st; if(!st) return;
  const ch = document.getElementById('chips');
  if(ch){
    document.getElementById('pcount').textContent = H.players.length;
    ch.innerHTML = H.players.length ? H.players.map(p=>`<button class="chip" data-k="${esc(p.k)}" title="Олиб ташлаш">${esc(p.n)} ✕</button>`).join('') : '<span class="empty">Ҳали ҳеч ким қўшилмади</span>';
  }
  const b = document.getElementById('board');
  if(b && st.ph === 'run'){
    board(b, H.board, true);
    const c = document.getElementById('cnt'); if(c) c.textContent = `${H.board.length} иштирокчи · ${H.board.filter(r=>r.d>=N).length} киши тугатди`;
  }
}
function hRender(){
  const st = H.st; if(!st) return;
  const link = location.origin + location.pathname + '?g=' + H.code;
  if(st.ph === 'lobby'){
    app.innerHTML = brand() + `<div class="top"><div><div class="tag">Ўйин коди</div><div class="code">${esc(H.code)}</div></div>${statusHTML()}</div>
    <div class="grid"><div class="card"><h2>Ўқувчилар қандай қўшилади</h2>
      <div class="join" style="margin-top:16px"><div id="qr"></div><div><p>Телефон камерасини QR-кодга тутинг ёки ҳаволани юборинг. Ҳар бир ўқувчи исм ва фамилиясини ёзади.</p><p class="link" id="lnk"></p><div class="row"><button class="btn" id="cp">Ҳаволани нусхалаш</button></div></div></div>
      <p class="note">${N} та савол, ҳар бирига 20 сония: энг кўпи билан ${Math.round(TOTAL/60000)} дақиқа.</p>
      <div class="row" style="margin-top:14px"><button class="btn pri" id="go">Ўйинни бошлаш</button><button class="btn" id="home">Бош саҳифа</button></div></div>
    <div class="card"><h2>Қўшилганлар: <span id="pcount">0</span></h2><div class="chips" id="chips"></div><p class="note">Ортиқча ёки нотўғри исмни босиб олиб ташлаш мумкин.</p></div></div>`;
    document.getElementById('lnk').textContent = link;
    try{ new QRCode(document.getElementById('qr'), {text:link, width:200, height:200, correctLevel:QRCode.CorrectLevel.M}); }catch(e){ document.getElementById('qr').remove(); }
    document.getElementById('cp').onclick = e => navigator.clipboard.writeText(link).then(()=>e.target.textContent='Нусхаланди ✓',()=>{});
    document.getElementById('go').onclick = async e => { e.target.disabled = true; try{ await api('start', {code:H.code, token:H.token}); }catch(err){ e.target.disabled = false; } hPoll(); };
    document.getElementById('home').onclick = () => hHome();
    document.getElementById('chips').onclick = async e => { const b = e.target.closest('.chip'); if(!b) return; b.disabled = true; try{ await api('kick', {code:H.code, token:H.token, k:b.dataset.k}); }catch(_){} hPoll(); };
    hLive(); return;
  }
  if(st.ph === 'final'){
    const rs = H.board;
    app.innerHTML = brand() + `<div class="top"><div><h1>Ўйин якунланди</h1><div class="tag">${N} та савол · ${rs.length} иштирокчи · код ${esc(H.code)}</div></div><div class="row"><button class="btn" id="copy">Натижаларни нусхалаш</button><button class="btn pri" id="again">Янги ўйин</button></div></div>
    <div class="card">${podium(rs)}
    <table class="stack"><thead><tr><th>Ўрин</th><th>Исм фамилия</th><th class="r">Тўғри</th><th class="r">Фоиз</th><th class="r">Вақт</th></tr></thead><tbody>
    ${rs.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td class="r">${r.s} / ${N}</td><td class="r">${Math.round(r.s/N*100)}%</td><td class="r">${sec(r.t)} с</td></tr>`).join('')}
    </tbody></table><p class="note">Балл тенг бўлса, тўғри жавобларга умумий тезроқ жавоб берган юқори туради. «Нусхалаш» жадвални Excel’га қўйишга тайёр ҳолда олади.</p></div>`;
    document.getElementById('again').onclick = () => { store.set('test-host', null); hHome(); };
    document.getElementById('copy').onclick = e => {
      const t = 'Ўрин\tИсм фамилия\tТўғри\tФоиз\tВақт (с)\n' + rs.map((r,i)=>`${i+1}\t${r.n}\t${r.s}\t${Math.round(r.s/N*100)}%\t${sec(r.t)}`).join('\n');
      navigator.clipboard.writeText(t).then(()=>e.target.textContent='Нусхаланди ✓', ()=>e.target.textContent='Нусхалаб бўлмади');
    };
    return;
  }
  app.innerHTML = brand() + `<div class="top"><div><div class="tag">Код ${esc(H.code)}</div><h1>Жонли табло</h1></div>
    <div class="row">${statusHTML()}<button class="btn" id="end">Ўйинни якунлаш</button></div></div>
  <div class="card"><div class="timer" style="margin-top:0"><div class="bar"><i id="tbar"></i></div><span class="num" id="tnum"></span></div>
    <div class="qmeta"><span id="cnt"></span><span>Ўрин: тўғри жавоблар сони, тенг бўлса — тезлик</span></div>
    <div class="board" id="board"></div></div>`;
  document.getElementById('end').onclick = e => { const b = e.currentTarget; if(b.dataset.sure) hEnd(); else { b.dataset.sure = 1; b.textContent = 'Ростдан якунлайми? Яна босинг'; } };
  hLive();
}

/* =================== O'QUVCHI =================== */
const P = Object.assign({k:rid(), fn:'', ln:'', code:''}, store.get('test-player')||{});
const S = {st:null, joined:false, view:'', flash:null, board:[], poll:null, busy:false};
const pSave = () => store.set('test-player', {k:P.k, fn:P.fn, ln:P.ln, code:P.code});
pSave();
const mineKey = () => 'test-mine:'+P.code+':'+P.k;
let mine = {};
const loadMine = () => { mine = store.get(mineKey()) || {}; };
const nextIdx = () => { for(let i=0;i<N;i++) if(!mine[i]) return i; return N; };
const qKey = i => 'test-qs:'+P.code+':'+P.k+':'+i;
function qStart(i){ let t = store.get(qKey(i)); if(!t){ t = now(); store.set(qKey(i), t); } return t; }

function pJoinForm(msg){
  S.joined = false; S.view = ''; clearInterval(S.poll);
  const code = params.get('g') || P.code || '';
  app.innerHTML = brand() + `<div class="top"><div><h1>Харид тести</h1><div class="tag">Жонли ўйинга қўшилиш</div></div>${statusHTML()}</div>
  <form class="card" id="jf" style="max-width:560px" novalidate>
    <label class="f">Ўйин коди<input type="text" id="cd" inputmode="numeric" maxlength="4" value="${esc(code)}" required></label>
    <div class="two" style="margin-top:12px"><label class="f">Исм<input type="text" id="fn" maxlength="24" autocomplete="given-name" value="${esc(P.fn)}" required></label>
    <label class="f">Фамилия<input type="text" id="ln" maxlength="24" autocomplete="family-name" value="${esc(P.ln)}" required></label></div>
    <div class="err" id="err">${esc(msg||'')}</div>
    <button class="btn pri" style="width:100%;margin-top:8px">Қўшилиш</button>
    <p class="note">Исм ва фамилиянгиз табло ҳамда якуний натижаларда кўринади.</p></form>`;
  document.getElementById('jf').onsubmit = async e => {
    e.preventDefault();
    const cd = document.getElementById('cd').value.trim(), fn = document.getElementById('fn').value.trim(), ln = document.getElementById('ln').value.trim();
    const er = document.getElementById('err'), btn = e.target.querySelector('button');
    if(!/^\d{4}$/.test(cd)){ er.textContent = 'Код 4 та рақамдан иборат.'; return; }
    if(fn.length < 2 || ln.length < 2){ er.textContent = 'Исм ва фамилияни тўлиқ ёзинг.'; return; }
    btn.disabled = true; er.textContent = '';
    try{
      if(P.code !== cd) P.k = rid();
      const j = await api('join', {code:cd, k:P.k, n:fn+' '+ln});
      P.fn = fn; P.ln = ln; P.code = cd; pSave();
      pStart(j.state);
    }catch(err){ er.textContent = err.message; btn.disabled = false; }
  };
}
function pStart(st){
  S.joined = true; S.st = st; loadMine(); clearInterval(S.poll);
  S.poll = setInterval(pPoll, 2500); pRender();
}
async function pPoll(){
  if(S.busy || !S.joined) return;
  const v = S.view;
  // savol ishlayotganda kamroq so'raymiz
  if(v.startsWith('q') && (Date.now() / 2500 | 0) % 2) return;
  S.busy = true;
  try{
    if(v === 'done' || v === 'final'){
      const j = await api('board', null, {code:P.code, k:P.k});
      S.st = j.state; S.board = j.board || []; pRender();
      if(j.state.ph === 'final') clearInterval(S.poll);
    } else {
      const j = await api('state', null, {code:P.code});
      S.st = j.state; pRender();
    }
  }catch(e){ if(e.status === 404) pJoinForm('Ўйин топилмади.'); }
  finally{ S.busy = false; }
}
async function answer(i, c){
  if(mine[i]) return;
  const ms = Math.round(Math.min(DUR, Math.max(0, now() - qStart(i))));
  mine[i] = 1; store.set(mineKey(), mine);
  S.flash = {wait:true, to: c < 0, until: Date.now() + 8000}; S.view = ''; pRender();
  let res = null;
  for(let t=0; t<3 && !res; t++){
    try{ res = await api('answer', {code:P.code, k:P.k, i, c, ms}); }
    catch(e){ if(e.status === 403){ pJoinForm('Ўқитувчи сизни рўйхатдан олиб ташлади. Қайта қўшилишингиз мумкин.'); return; } if(e.status && e.status < 500) break; await new Promise(r=>setTimeout(r, 700)); }
  }
  S.flash = {to: c < 0, ok: !!(res && res.right), unk: !res, until: Date.now() + (c < 0 ? 900 : 700)};
  S.view = ''; pRender();
}
function pRender(){
  if(!S.joined) return;
  const st = S.st, t = now();
  const head = `<div class="top"><div><div class="tag">${esc(P.fn+' '+P.ln)} · код ${esc(P.code)}</div><h2 id="ttl">Харид тести</h2></div>${statusHTML()}</div>`;
  let view;
  if(!st || st.ph === 'lobby') view = 'lobby';
  else if(st.ph === 'final') view = 'final';
  else if(t < st.s) view = 'ready';
  else if(S.flash && Date.now() < S.flash.until) view = S.flash.wait ? 'wait' : 'flash';
  else if(nextIdx() >= N || t > st.s + TOTAL) view = 'done';
  else view = 'q' + nextIdx();
  if(view === S.view && view !== 'done' && view !== 'final') return;
  const changed = view !== S.view; S.view = view;
  if(view === 'lobby'){ app.innerHTML = brand() + head + `<div class="card"><div class="msg pulse">Ўқитувчи ўйинни бошлашини кутинг…</div><p class="note" style="text-align:center">Бошлангач, ҳар бир саволга 20 сония берилади. Жавоб берсангиз, кейинги саволга дарров ўтасиз.</p></div>`; return; }
  if(view === 'ready'){ app.innerHTML = brand() + head + `<div class="card"><div class="msg">Тайёрланинг… <span class="num" id="rd"></span></div></div>`; return; }
  if(view === 'wait'){ app.innerHTML = brand() + head + `<div class="card"><div class="msg pulse">Жавоб юборилмоқда…</div></div>`; return; }
  if(view === 'flash'){
    const f = S.flash, txt = f.to ? 'Вақт тугади' : f.unk ? 'Жавоб қабул қилинди' : f.ok ? 'Тўғри ✓' : 'Нотўғри ✗';
    app.innerHTML = brand() + head + `<div class="card"><div class="res"><div class="num ${f.to||f.unk?'':f.ok?'good':'badc'}" style="font-size:clamp(30px,8vw,52px)">${txt}</div></div></div>`;
    setTimeout(pRender, f.until - Date.now() + 20); return;
  }
  if(view === 'done' || view === 'final'){
    if(changed){
      app.innerHTML = brand() + head + `<div class="card"><div class="res"><div class="tag" id="dtag"></div><div class="num" id="place">—</div><div id="mys"></div></div>
        <h2 style="margin:22px 0 12px" id="bt"></h2><div class="board" id="pboard"></div></div>`;
      if(!S.board.length) pPoll();
    }
    const fin = view === 'final', rs = S.board, me = rs.findIndex(r=>r.me), r = rs[me];
    document.getElementById('dtag').textContent = fin ? 'Якуний ўрнингиз' : 'Сиз тугатдингиз. Ҳозирги ўрнингиз';
    document.getElementById('place').textContent = me >= 0 ? me+1 : '—';
    document.getElementById('mys').textContent = r ? `${r.s} / ${N} та тўғри · ${sec(r.t)} с` : '';
    document.getElementById('bt').textContent = fin ? 'Якуний табло' : 'Жонли табло (бошқалар ҳали ишламоқда)';
    board(document.getElementById('pboard'), rs, !fin);
    return;
  }
  const i = nextIdx(), q = QS[i]; qStart(i);
  app.innerHTML = brand() + head + `<div class="card"><div class="qmeta"><span>${esc(q.t)}</span><span>Савол ${i+1} / ${N}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="timer"><div class="bar"><i id="tbar"></i></div><span class="num" id="tnum"></span></div>
    <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-i="${j}"><b>${L[j]}</b><span>${esc(o)}</span></button>`).join('')}</div></div>`;
  document.getElementById('ttl').textContent = `Савол ${i+1} / ${N}`;
  app.querySelector('.opts').onclick = e => { const b = e.target.closest('.opt'); if(b) answer(i, +b.dataset.i); };
  pTick();
}
function pTick(){
  const st = S.st; if(!S.joined || !st || st.ph !== 'run') return;
  const t = now();
  if(S.view === 'ready'){ const rd = document.getElementById('rd'); if(rd) rd.textContent = Math.max(1, Math.ceil((st.s - t)/1000)); if(t >= st.s) pRender(); return; }
  if(!S.view.startsWith('q')) return;
  const i = +S.view.slice(1);
  if(t > st.s + TOTAL){ pRender(); return; }
  const rem = Math.max(0, DUR - (t - qStart(i)));
  const tn = document.getElementById('tnum'), tb = document.getElementById('tbar');
  if(tn) tn.textContent = Math.ceil(rem/1000);
  if(tb) tb.style.width = (rem/DUR*100) + '%';
  if(rem <= 0) answer(i, -1);
}
setInterval(pTick, 200);

/* =================== ishga tushirish =================== */
if(params.has('teacher') || params.has('oqituvchi')) hHome();
else if(P.code && P.fn && P.ln && (!params.get('g') || params.get('g') === P.code)){
  api('state', null, {code:P.code}).then(j => j.state.ph === 'final' && !params.get('g') ? pJoinForm() : pStart(j.state)).catch(() => pJoinForm());
} else pJoinForm();
}
</script>
